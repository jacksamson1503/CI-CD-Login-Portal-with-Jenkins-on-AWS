name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED for AWS OIDC authentication

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: login-portal
  SNS_TOPIC_ARN: arn:aws:sns:us-east-1:181188392988:aws-daily-operations-report
  CONTAINER_NAME: login-portal
  AWS_ROLE_ARN: arn:aws:iam::181188392988:role/GitHubActions-ECR-Deploy

jobs:
  # =========================================================================
  # STAGE 1: QUALITY GATE & STATIC ANALYSIS
  # =========================================================================
  quality-gate:
    name: Quality Gate & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          echo "Validating JavaScript files..."
          node --check script.js
          node --check javascript.js
          echo "JavaScript syntax validation passed."

      - name: Verify Web Assets Integrity
        run: |
          echo "Checking web assets integrity..."
          test -s index.html || { echo "index.html missing or empty"; exit 1; }
          test -s style.css || { echo "style.css missing or empty"; exit 1; }
          test -s script.js || { echo "script.js missing or empty"; exit 1; }
          test -s Dockerfile || { echo "Dockerfile missing or empty"; exit 1; }
          grep -i "<html" index.html || { echo "Missing <html> tag in index.html"; exit 1; }
          grep -i "<html" password.html || { echo "Missing <html> tag in password.html"; exit 1; }
          echo "Web assets integrity check passed."

      - name: Dockerfile Syntax & Build Sanity Check
        run: |
          echo "Testing Docker build sanity in Quality Gate..."
          docker build --no-cache -t quality-gate-test .
          docker rmi quality-gate-test
          echo "Dockerfile quality gate passed."

  # =========================================================================
  # STAGE 2: BUILD & PUSH DOCKER IMAGE TO AWS ECR
  # =========================================================================
  build-and-push:
    name: Build & Store Image in AWS ECR
    needs: [quality-gate]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      ecr_repository: ${{ steps.build-image.outputs.ecr_repository }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: set-tag
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
          CUSTOM_ECR_REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          TARGET_REPO="${CUSTOM_ECR_REPO:-login-portal}"
          if [ -z "$TARGET_REPO" ]; then
            TARGET_REPO="login-portal"
          fi
          echo "Building Docker image: $ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG" -t "$ECR_REGISTRY/$TARGET_REPO:latest" .
          
          echo "Pushing images to Amazon ECR..."
          docker push "$ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$TARGET_REPO:latest"
          
          echo "Verifying pushed images in AWS ECR..."
          aws ecr describe-images --repository-name "$TARGET_REPO" --region ${{ env.AWS_REGION }} --query 'imageDetails[*].imageTags' --output text || true

          echo "image=$ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "ecr_repository=$TARGET_REPO" >> $GITHUB_OUTPUT
          echo "Docker image stored in ECR successfully."

  # =========================================================================
  # STAGE 3: DEPLOY TO AWS EC2 WITH AUTOMATIC ROLLBACK
  # =========================================================================
  deploy:
    name: Deploy to EC2 with Automated Rollback
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate ECR Auth Token for EC2
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: SSH to EC2 & Execute Production Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ needs.build-and-push.outputs.ecr_repository || 'login-portal' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          ECR_TOKEN: ${{ steps.ecr-token.outputs.token }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ECR_TOKEN,CONTAINER_NAME
          script_stop: true
          script: |
            set -e
            echo "=========================================================="
            echo "STARTING REAL-TIME PRODUCTION DEPLOYMENT"
            TARGET_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            echo "Target Image: $TARGET_IMAGE"
            echo "=========================================================="

            if docker info > /dev/null 2>&1; then
              DOCKER_CMD="docker"
            else
              DOCKER_CMD="sudo docker"
            fi

            # Step 1: AWS ECR Authentication on EC2
            echo "Step 1: Authenticating Docker with Amazon ECR..."
            echo "$ECR_TOKEN" | $DOCKER_CMD login --username AWS --password-stdin "$ECR_REGISTRY"
            echo "$ECR_TOKEN" | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY" 2>/dev/null || true

            # Step 2: Pull New Image with fallback
            echo "Step 2: Pulling new image from ECR..."
            if ! $DOCKER_CMD pull "$TARGET_IMAGE"; then
              echo "Specific commit tag pull returned not found. Trying fallback to 'latest' tag..."
              TARGET_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
              $DOCKER_CMD pull "$TARGET_IMAGE"
            fi

            # Step 3: Backup existing container for instant rollback
            echo "Step 3: Staging existing container for rollback safeguard..."
            BACKUP_CONTAINER="${CONTAINER_NAME}-backup"
            
            $DOCKER_CMD rm -f "$BACKUP_CONTAINER" 2>/dev/null || true

            HAS_PREVIOUS="false"
            if [ "$($DOCKER_CMD ps -q -f name=^/${CONTAINER_NAME}$)" ]; then
              echo "Active container found. Renaming to $BACKUP_CONTAINER..."
              $DOCKER_CMD stop "$CONTAINER_NAME"
              $DOCKER_CMD rename "$CONTAINER_NAME" "$BACKUP_CONTAINER"
              HAS_PREVIOUS="true"
            elif [ "$($DOCKER_CMD ps -aq -f name=^/${CONTAINER_NAME}$)" ]; then
              $DOCKER_CMD rm -f "$CONTAINER_NAME"
            fi

            # Ensure port 80 is free from existing system web servers (like Apache)
            sudo systemctl stop apache2 2>/dev/null || true

            # Step 4: Run New Container
            echo "Step 4: Launching new container ($CONTAINER_NAME)..."
            $DOCKER_CMD run -d \
              --name "$CONTAINER_NAME" \
              -p 80:80 \
              --restart unless-stopped \
              "$TARGET_IMAGE"

            # Step 5: Automated Health Check with Auto-Rollback
            echo "Step 5: Verifying container health..."
            HEALTH_CHECK_PASSED="false"
            for i in 1 2 3 4 5; do
              sleep 4
              if curl -s -f --connect-timeout 3 http://localhost:80/index.html > /dev/null 2>&1 || curl -s -f --connect-timeout 3 http://localhost:80/ > /dev/null 2>&1; then
                echo "Health check attempt $i: PASSED! Web portal is responding."
                HEALTH_CHECK_PASSED="true"
                break
              else
                echo "Health check attempt $i: Waiting for container response..."
              fi
            done

            # Step 6: Rollback Evaluation
            if [ "$HEALTH_CHECK_PASSED" != "true" ]; then
              echo "CRITICAL: Health check FAILED! Stopping pipeline and initiating automatic rollback..."
              $DOCKER_CMD rm -f "$CONTAINER_NAME" 2>/dev/null || true
              
              if [ "$HAS_PREVIOUS" = "true" ]; then
                echo "Restoring previous working container ($BACKUP_CONTAINER -> $CONTAINER_NAME)..."
                $DOCKER_CMD rename "$BACKUP_CONTAINER" "$CONTAINER_NAME"
                $DOCKER_CMD start "$CONTAINER_NAME"
                echo "Rollback successful: Previous working version restored and serving traffic."
              else
                echo "No previous running container was available to restore."
              fi
              exit 1
            fi

            # Cleanup backup container on success
            echo "Step 7: Deployment verified healthy. Cleaning up backup container..."
            $DOCKER_CMD rm -f "$BACKUP_CONTAINER" 2>/dev/null || true
            echo "=========================================================="
            echo "PRODUCTION DEPLOYMENT FINISHED SUCCESSFULLY!"
            echo "=========================================================="

  # =========================================================================
  # STAGE 4: AWS SNS NOTIFICATION (ALWAYS RUNS ON SUCCESS OR FAILURE)
  # =========================================================================
  notify-sns:
    name: Send SNS Operations Report
    needs: [quality-gate, build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Notification to AWS SNS
        env:
          QG_STATUS: ${{ needs.quality-gate.result }}
          BUILD_STATUS: ${{ needs.build-and-push.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$QG_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ]; then
            OVERALL_STATUS="SUCCESSFUL"
            SUBJECT="[CI/CD SUCCESS] Production Deployment Succeeded - ${{ github.repository }}"
            SUMMARY="All stages passed successfully. The new Docker container is running and healthy on EC2."
          else
            OVERALL_STATUS="FAILED"
            SUBJECT="[CI/CD FAILURE / ROLLBACK] Deployment Alert - ${{ github.repository }}"
            SUMMARY="The pipeline encountered a failure and was halted."
          fi

          MESSAGE=$(printf "==================================================\nAWS CI/CD PIPELINE OPERATIONS REPORT\n==================================================\nStatus: %s\nRepository: %s\nBranch: %s\nCommit SHA: %s\nTriggered By: %s\nWorkflow URL: %s\n\nSTAGE BREAKDOWN:\n- Quality Gate: %s\n- Build & ECR Push: %s\n- EC2 Deployment: %s\n\nDETAILS:\n%s\n==================================================" \
            "$OVERALL_STATUS" \
            "${{ github.repository }}" \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "${{ github.actor }}" \
            "$WORKFLOW_RUN_URL" \
            "$QG_STATUS" \
            "$BUILD_STATUS" \
            "$DEPLOY_STATUS" \
            "$SUMMARY")

          if [ -n "${{ env.SNS_TOPIC_ARN }}" ]; then
            echo "Publishing to SNS: ${{ env.SNS_TOPIC_ARN }}"
            aws sns publish \
              --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
              --subject "$SUBJECT" \
              --message "$MESSAGE"
            echo "AWS SNS Notification sent successfully."
          else
            echo "SNS_TOPIC_ARN is empty, skipping notification."
          fi
