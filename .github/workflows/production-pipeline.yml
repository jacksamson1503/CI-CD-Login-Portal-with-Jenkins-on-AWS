name: Production & Staging CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED for AWS OIDC authentication

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: login-portal
  CONTAINER_NAME: login-portal
  SNS_TOPIC_ARN: arn:aws:sns:us-east-1:181188392988:aws-daily-operations-report

jobs:
  # =========================================================================
  # STAGE 1: QUALITY GATE & STATIC ANALYSIS
  # =========================================================================
  quality-gate:
    name: Quality Gate & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          echo "Validating JavaScript files..."
          node --check script.js
          node --check javascript.js
          echo "JavaScript syntax validation passed."

      - name: Verify Web Assets Integrity
        run: |
          echo "Checking web assets integrity..."
          test -s index.html || { echo "index.html missing or empty"; exit 1; }
          test -s style.css || { echo "style.css missing or empty"; exit 1; }
          test -s script.js || { echo "script.js missing or empty"; exit 1; }
          test -s Dockerfile || { echo "Dockerfile missing or empty"; exit 1; }
          grep -i "<html" index.html || { echo "Missing <html> tag in index.html"; exit 1; }
          grep -i "<html" password.html || { echo "Missing <html> tag in password.html"; exit 1; }
          echo "Web assets integrity check passed."

      - name: Dockerfile Syntax & Build Sanity Check
        run: |
          echo "Testing Docker build sanity in Quality Gate..."
          docker build --no-cache -t quality-gate-test .
          docker rmi quality-gate-test
          echo "Dockerfile quality gate passed."

  # =========================================================================
  # STAGE 2: BUILD, PUSH & AUTO-CLEANUP IN AWS ECR (KEEP LAST 4)
  # =========================================================================
  build-and-push:
    name: Build & Store Image in AWS ECR
    needs: [quality-gate]
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: set-tag
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
          TARGET_REPO: ${{ env.ECR_REPOSITORY }}
        run: |
          echo "Building Docker image: $ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG" -t "$ECR_REGISTRY/$TARGET_REPO:latest" .
          
          echo "Pushing images to Amazon ECR..."
          docker push "$ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$TARGET_REPO:latest"
          
          echo "Verifying pushed images in AWS ECR..."
          aws ecr describe-images --repository-name "$TARGET_REPO" --region ${{ env.AWS_REGION }} --query 'imageDetails[*].imageTags' --output text || true

      - name: Retain Only Last 4 Images in AWS ECR
        env:
          TARGET_REPO: ${{ env.ECR_REPOSITORY }}
        run: |
          echo "Enforcing ECR retention policy: keeping only last 4 images..."
          
          # Delete any untagged images first
          UNTAGGED_DIGESTS=$(aws ecr list-images \
            --repository-name "$TARGET_REPO" \
            --region ${{ env.AWS_REGION }} \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds[*].imageDigest' \
            --output text 2>/dev/null || true)
          
          if [ -n "$UNTAGGED_DIGESTS" ] && [ "$UNTAGGED_DIGESTS" != "None" ]; then
            for digest in $UNTAGGED_DIGESTS; do
              aws ecr batch-delete-image --repository-name "$TARGET_REPO" --region ${{ env.AWS_REGION }} --image-ids imageDigest=$digest 2>/dev/null || true
            done
          fi

          # Find digests older than the top 4 most recent images
          OLD_ECR_DIGESTS=$(aws ecr describe-images \
            --repository-name "$TARGET_REPO" \
            --region ${{ env.AWS_REGION }} \
            --query 'reverse(sort_by(imageDetails,&imagePushedAt))[4:].imageDigest' \
            --output text 2>/dev/null || true)

          if [ -n "$OLD_ECR_DIGESTS" ] && [ "$OLD_ECR_DIGESTS" != "None" ]; then
            for digest in $OLD_ECR_DIGESTS; do
              echo "Pruning older ECR image: $digest"
              aws ecr batch-delete-image --repository-name "$TARGET_REPO" --region ${{ env.AWS_REGION }} --image-ids imageDigest=$digest 2>/dev/null || true
            done
            echo "ECR cleanup complete: only the 4 newest images are preserved."
          else
            echo "Total images in ECR is within the 4 image limit."
          fi

  # =========================================================================
  # STAGE 3: DEPLOY TO DEV-SERVER (STAGING ENVIRONMENT)
  # =========================================================================
  deploy-staging:
    name: Deploy to Dev-server (Staging)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Deployment Variables
        id: prep
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: SSH to Dev-server & Execute Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.prep.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_TOKEN: ${{ steps.prep.outputs.token }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY || secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ECR_TOKEN,CONTAINER_NAME
          script_stop: true
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            export NEEDRESTART_MODE=a

            echo "=========================================================="
            echo "STARTING DEPLOYMENT ON DEV-SERVER (STAGING)"
            TARGET_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            echo "Target Image: $TARGET_IMAGE"
            echo "=========================================================="

            # Auto-install Docker and curl without failing on service restarts
            if ! command -v docker > /dev/null 2>&1; then
              echo "Docker not found on host. Installing Docker..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" docker.io curl || true
              sudo systemctl enable --now docker || true
              sudo usermod -aG docker "$USER" 2>/dev/null || true
            fi
            sudo systemctl start docker || true

            # Determine Docker execution command
            if docker info > /dev/null 2>&1; then
              DOCKER_CMD="docker"
            else
              DOCKER_CMD="sudo docker"
            fi

            # Step 1: Login Docker to ECR
            echo "Authenticating Docker with Amazon ECR on Dev-server..."
            echo "$ECR_TOKEN" | $DOCKER_CMD login --username AWS --password-stdin "$ECR_REGISTRY"

            # Step 2: Pull Target Image
            echo "Pulling Docker image: $TARGET_IMAGE..."
            $DOCKER_CMD pull "$TARGET_IMAGE"

            # Step 3: Stop & Remove old container if present
            echo "Stopping old container if present..."
            $DOCKER_CMD rm -f "$CONTAINER_NAME" 2>/dev/null || true

            # Free port 80 from host web servers if any
            sudo systemctl stop apache2 2>/dev/null || true
            sudo systemctl stop nginx 2>/dev/null || true

            # Step 4: Run New Container
            echo "Launching new container on port 80..."
            $DOCKER_CMD run -d \
              --name "$CONTAINER_NAME" \
              -p 80:80 \
              --restart unless-stopped \
              "$TARGET_IMAGE"

            # Step 5: Verification & Health Check
            echo "Running health checks on Dev-server..."
            HEALTH_PASSED="false"
            for i in 1 2 3 4 5; do
              sleep 4
              if curl -s -f --connect-timeout 3 http://localhost:80/ > /dev/null 2>&1 || curl -s -f --connect-timeout 3 http://localhost:80/index.html > /dev/null 2>&1; then
                echo "Health check attempt $i: PASSED! Dev-server is live."
                HEALTH_PASSED="true"
                break
              else
                echo "Health check attempt $i: Waiting for container response..."
              fi
            done

            if [ "$HEALTH_PASSED" != "true" ]; then
              echo "Health check FAILED on Dev-server!"
              exit 1
            fi

            # Step 6: Host Docker Cleanup (Keep only running container & last 4 images)
            echo "Performing Docker cleanup on Dev-server..."
            $DOCKER_CMD container prune -f 2>/dev/null || true

            OLD_IMAGES=$($DOCKER_CMD images "$ECR_REGISTRY/$ECR_REPOSITORY" --format "{{.CreatedAt}}\t{{.ID}}" 2>/dev/null | sort -r | awk '{print $NF}' | awk '!seen[$0]++' | tail -n +5 || true)
            if [ -n "$OLD_IMAGES" ]; then
              echo "Deleting older Docker images beyond latest 4 on Dev-server: $OLD_IMAGES"
              echo "$OLD_IMAGES" | xargs -r $DOCKER_CMD rmi -f 2>/dev/null || true
            fi
            $DOCKER_CMD image prune -f 2>/dev/null || true

            echo "=========================================================="
            echo "DEV-SERVER (STAGING) DEPLOYMENT COMPLETED SUCCESSFULLY!"
            echo "=========================================================="

  # =========================================================================
  # STAGE 4: DEPLOY TO PROD-SERVER (PRODUCTION ENVIRONMENT)
  # =========================================================================
  deploy-production:
    name: Deploy to Prod-server (Production)
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Deployment Variables
        id: prep
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: SSH to Prod-server & Execute Production Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.prep.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_TOKEN: ${{ steps.prep.outputs.token }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USER }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY || secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ECR_TOKEN,CONTAINER_NAME
          script_stop: true
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            export NEEDRESTART_MODE=a

            echo "=========================================================="
            echo "STARTING REAL-TIME PRODUCTION DEPLOYMENT ON PROD-SERVER"
            TARGET_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            echo "Target Image: $TARGET_IMAGE"
            echo "=========================================================="

            # Auto-install Docker and curl without failing on service restarts
            if ! command -v docker > /dev/null 2>&1; then
              echo "Docker not found on host. Installing Docker..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" docker.io curl || true
              sudo systemctl enable --now docker || true
              sudo usermod -aG docker "$USER" 2>/dev/null || true
            fi
            sudo systemctl start docker || true

            # Determine Docker execution command
            if docker info > /dev/null 2>&1; then
              DOCKER_CMD="docker"
            else
              DOCKER_CMD="sudo docker"
            fi

            # Step 1: AWS ECR Authentication on EC2
            echo "Step 1: Authenticating Docker with Amazon ECR..."
            echo "$ECR_TOKEN" | $DOCKER_CMD login --username AWS --password-stdin "$ECR_REGISTRY"

            # Step 2: Pull New Image with fallback
            echo "Step 2: Pulling new image from ECR..."
            if ! $DOCKER_CMD pull "$TARGET_IMAGE"; then
              echo "Specific commit tag pull returned not found. Trying fallback to 'latest' tag..."
              TARGET_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
              $DOCKER_CMD pull "$TARGET_IMAGE"
            fi

            # Step 3: Backup existing container for instant rollback safeguard
            echo "Step 3: Staging existing container for rollback safeguard..."
            BACKUP_CONTAINER="${CONTAINER_NAME}-backup"
            $DOCKER_CMD rm -f "$BACKUP_CONTAINER" 2>/dev/null || true

            HAS_PREVIOUS="false"
            if [ "$($DOCKER_CMD ps -q -f name=^/${CONTAINER_NAME}$)" ]; then
              echo "Active container found. Renaming to $BACKUP_CONTAINER..."
              $DOCKER_CMD stop "$CONTAINER_NAME"
              $DOCKER_CMD rename "$CONTAINER_NAME" "$BACKUP_CONTAINER"
              HAS_PREVIOUS="true"
            elif [ "$($DOCKER_CMD ps -aq -f name=^/${CONTAINER_NAME}$)" ]; then
              $DOCKER_CMD rm -f "$CONTAINER_NAME"
            fi

            # Ensure port 80 is free from existing system web servers
            sudo systemctl stop apache2 2>/dev/null || true
            sudo systemctl stop nginx 2>/dev/null || true

            # Step 4: Run New Container
            echo "Step 4: Launching new container ($CONTAINER_NAME)..."
            $DOCKER_CMD run -d \
              --name "$CONTAINER_NAME" \
              -p 80:80 \
              --restart unless-stopped \
              "$TARGET_IMAGE"

            # Step 5: Automated Health Check with Auto-Rollback
            echo "Step 5: Verifying container health on Prod-server..."
            HEALTH_CHECK_PASSED="false"
            for i in 1 2 3 4 5; do
              sleep 4
              if curl -s -f --connect-timeout 3 http://localhost:80/index.html > /dev/null 2>&1 || curl -s -f --connect-timeout 3 http://localhost:80/ > /dev/null 2>&1; then
                echo "Health check attempt $i: PASSED! Web portal is responding."
                HEALTH_CHECK_PASSED="true"
                break
              else
                echo "Health check attempt $i: Waiting for container response..."
              fi
            done

            # Step 6: Rollback Evaluation
            if [ "$HEALTH_CHECK_PASSED" != "true" ]; then
              echo "CRITICAL: Health check FAILED! Initiating automatic rollback..."
              $DOCKER_CMD rm -f "$CONTAINER_NAME" 2>/dev/null || true
              
              if [ "$HAS_PREVIOUS" = "true" ]; then
                echo "Restoring previous working container ($BACKUP_CONTAINER -> $CONTAINER_NAME)..."
                $DOCKER_CMD rename "$BACKUP_CONTAINER" "$CONTAINER_NAME"
                $DOCKER_CMD start "$CONTAINER_NAME"
                echo "Rollback successful: Previous working version restored."
              else
                echo "No previous running container was available to restore."
              fi
              exit 1
            fi

            # Step 7: Cleanup backup container on success
            echo "Step 7: Deployment verified healthy. Cleaning up backup container..."
            $DOCKER_CMD rm -f "$BACKUP_CONTAINER" 2>/dev/null || true

            # Step 8: Auto-Cleanup: Keep only active container & last 4 Docker images
            echo "Step 8: Performing Docker host cleanup on Prod-server..."
            $DOCKER_CMD container prune -f 2>/dev/null || true

            OLD_IMAGES=$($DOCKER_CMD images "$ECR_REGISTRY/$ECR_REPOSITORY" --format "{{.CreatedAt}}\t{{.ID}}" 2>/dev/null | sort -r | awk '{print $NF}' | awk '!seen[$0]++' | tail -n +5 || true)
            if [ -n "$OLD_IMAGES" ]; then
              echo "Deleting older Docker images beyond latest 4 on Prod-server: $OLD_IMAGES"
              echo "$OLD_IMAGES" | xargs -r $DOCKER_CMD rmi -f 2>/dev/null || true
            fi
            $DOCKER_CMD image prune -f 2>/dev/null || true

            echo "=========================================================="
            echo "PROD-SERVER PRODUCTION DEPLOYMENT FINISHED SUCCESSFULLY!"
            echo "=========================================================="

  # =========================================================================
  # STAGE 5: NOTIFICATION REPORT TO EMAIL VIA AWS SNS
  # =========================================================================
  notify:
    name: Operations Summary & SNS Email
    needs: [quality-gate, build-and-push, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Operations Report to SNS Email
        env:
          QG_STATUS: ${{ needs.quality-gate.result }}
          BUILD_STATUS: ${{ needs.build-and-push.result }}
          STAGING_STATUS: ${{ needs.deploy-staging.result }}
          PROD_STATUS: ${{ needs.deploy-production.result }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOPIC_ARN: ${{ env.SNS_TOPIC_ARN }}
        run: |
          if [ "$QG_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ] && [ "$STAGING_STATUS" = "success" ] && [ "$PROD_STATUS" = "success" ]; then
            OVERALL_STATUS="SUCCESS"
            SUBJECT="[CI/CD SUCCESS] Staging & Production Deployment Succeeded - ${{ github.repository }}"
            SUMMARY="All stages passed successfully! The application container is running and healthy on both Dev-server and Prod-server."
          else
            OVERALL_STATUS="FAILED"
            SUBJECT="[CI/CD ALERT] Deployment Failed - ${{ github.repository }}"
            SUMMARY="The pipeline encountered a failure during execution. Check the logs for details."
          fi

          MESSAGE=$(printf "==================================================\nAWS CI/CD PIPELINE OPERATIONS REPORT\n==================================================\nOverall Status: %s\nRepository:     %s\nBranch:         %s\nCommit SHA:     %s\nTriggered By:   %s\nWorkflow URL:   %s\n\nSTAGE BREAKDOWN:\n- 1. Quality Gate:       %s\n- 2. Build & ECR Push:   %s\n- 3. Dev-server Staging: %s\n- 4. Prod-server Deploy: %s\n\nDETAILS:\n%s\n==================================================" \
            "$OVERALL_STATUS" \
            "${{ github.repository }}" \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "${{ github.actor }}" \
            "$WORKFLOW_URL" \
            "$QG_STATUS" \
            "$BUILD_STATUS" \
            "$STAGING_STATUS" \
            "$PROD_STATUS" \
            "$SUMMARY")

          echo "$MESSAGE"

          if [ -n "$TOPIC_ARN" ]; then
            echo "Publishing Operations Report to SNS: $TOPIC_ARN..."
            aws sns publish \
              --topic-arn "$TOPIC_ARN" \
              --subject "$SUBJECT" \
              --message "$MESSAGE" || echo "Warning: SNS publish failed. Please check role SNS permissions."
          fi
