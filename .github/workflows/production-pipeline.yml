name: Enterprise Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED for AWS OIDC authentication

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: login-portal
  CONTAINER_NAME: login-portal
  SNS_TOPIC_ARN: arn:aws:sns:us-east-1:181188392988:aws-daily-operations-report

jobs:
  # =========================================================================
  # TRACK 1A: CODE QUALITY GATE & ASSET INTEGRITY
  # =========================================================================
  code-quality:
    name: Code Quality & Asset Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          echo "Validating JavaScript files..."
          node --check script.js
          node --check javascript.js
          echo "JavaScript syntax check PASSED."

      - name: Verify Web Assets Integrity
        run: |
          echo "Checking web assets integrity..."
          test -s index.html || { echo "index.html missing or empty"; exit 1; }
          test -s style.css || { echo "style.css missing or empty"; exit 1; }
          test -s script.js || { echo "script.js missing or empty"; exit 1; }
          test -s Dockerfile || { echo "Dockerfile missing or empty"; exit 1; }
          grep -i "<html" index.html || { echo "Missing <html> tag in index.html"; exit 1; }
          grep -i "<html" password.html || { echo "Missing <html> tag in password.html"; exit 1; }
          echo "Web assets integrity check PASSED."

  # =========================================================================
  # TRACK 1B: DOCKER SANITY & SECURITY AUDIT (RUNS IN PARALLEL)
  # =========================================================================
  security-audit:
    name: Docker Sanity & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dockerfile Syntax & Build Sanity Check
        run: |
          echo "Testing Dockerfile build sanity..."
          docker build --no-cache -t quality-gate-test .
          docker rmi quality-gate-test
          echo "Docker build sanity check PASSED."

      - name: Security Best-Practices Audit
        run: |
          echo "Auditing configuration for sensitive data..."
          if grep -r -i -E "BEGIN (RSA|OPENSSH) PRIVATE KEY" . --exclude-dir=".git" 2>/dev/null; then
            echo "CRITICAL: Private key detected in repository!"
            exit 1
          fi
          echo "Security audit PASSED. No leaked keys found."

  # =========================================================================
  # STAGE 2: BUILD, TAG & PUSH DOCKER IMAGE TO AWS ECR
  # =========================================================================
  build-and-push:
    name: Build & Store Image in AWS ECR
    needs: [code-quality, security-audit]
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: set-tag
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
          TARGET_REPO: ${{ env.ECR_REPOSITORY }}
        run: |
          echo "Building Docker image: $ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG" -t "$ECR_REGISTRY/$TARGET_REPO:latest" .
          
          echo "Pushing images to Amazon ECR..."
          docker push "$ECR_REGISTRY/$TARGET_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$TARGET_REPO:latest"
          
          echo "Image successfully stored in Amazon ECR."

  # =========================================================================
  # TRACK 3A: RUNNER CONTAINER INTEGRATION TEST ($0 STAGING)
  # =========================================================================
  container-test:
    name: Runner Container Test ($0 Staging)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Launch Container & Verify Web Health
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          TARGET_IMAGE="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          echo "Spinning up ephemeral test container: $TARGET_IMAGE"
          docker run -d --name runner-integration-test -p 8080:80 "$TARGET_IMAGE"
          
          sleep 4
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "Integration Test HTTP Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: Container failed health check on runner!"
            docker logs runner-integration-test
            docker rm -f runner-integration-test
            exit 1
          fi

          echo "Container integration test passed with HTTP 200 OK!"
          docker rm -f runner-integration-test

  # =========================================================================
  # TRACK 3B: ECR LIFECYCLE & RETENTION HYGIENE (RUNS IN PARALLEL)
  # =========================================================================
  ecr-hygiene:
    name: ECR Retention (Keep Last 4)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Clean Untagged and Enforce 4-Image Limit
        env:
          TARGET_REPO: ${{ env.ECR_REPOSITORY }}
        run: |
          echo "Enforcing ECR retention limit of 4 images..."
          
          UNTAGGED_DIGESTS=$(aws ecr list-images \
            --repository-name "$TARGET_REPO" \
            --region ${{ env.AWS_REGION }} \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds[*].imageDigest' \
            --output text 2>/dev/null || true)
          
          if [ -n "$UNTAGGED_DIGESTS" ] && [ "$UNTAGGED_DIGESTS" != "None" ]; then
            for digest in $UNTAGGED_DIGESTS; do
              aws ecr batch-delete-image --repository-name "$TARGET_REPO" --region ${{ env.AWS_REGION }} --image-ids imageDigest=$digest 2>/dev/null || true
            done
          fi

          OLD_ECR_DIGESTS=$(aws ecr describe-images \
            --repository-name "$TARGET_REPO" \
            --region ${{ env.AWS_REGION }} \
            --query 'reverse(sort_by(imageDetails,&imagePushedAt))[4:].imageDigest' \
            --output text 2>/dev/null || true)

          if [ -n "$OLD_ECR_DIGESTS" ] && [ "$OLD_ECR_DIGESTS" != "None" ]; then
            for digest in $OLD_ECR_DIGESTS; do
              echo "Pruning older ECR image: $digest"
              aws ecr batch-delete-image --repository-name "$TARGET_REPO" --region ${{ env.AWS_REGION }} --image-ids imageDigest=$digest 2>/dev/null || true
            done
            echo "ECR cleanup complete."
          else
            echo "ECR image count is within the 4 image limit."
          fi

  # =========================================================================
  # STAGE 4: ZERO-DOWNTIME SAFE DEPLOYMENT TO SINGLE PROD EC2
  # =========================================================================
  deploy-production:
    name: Zero-Downtime Deploy to EC2
    needs: [container-test, ecr-hygiene]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Deployment Variables
        id: prep
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: SSH to Prod-server & Execute Zero-Downtime Swap
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.prep.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_TOKEN: ${{ steps.prep.outputs.token }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USER }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY || secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ECR_TOKEN,CONTAINER_NAME
          script_stop: true
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            export NEEDRESTART_MODE=a

            echo "=========================================================="
            echo "STARTING ZERO-DOWNTIME SAFE PRODUCTION DEPLOYMENT"
            TARGET_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            echo "Target Image: $TARGET_IMAGE"
            echo "=========================================================="

            if ! command -v docker > /dev/null 2>&1; then
              echo "Installing Docker..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" docker.io curl || true
              sudo systemctl enable --now docker || true
              sudo usermod -aG docker "$USER" 2>/dev/null || true
            fi
            sudo systemctl start docker || true

            if docker info > /dev/null 2>&1; then
              DOCKER_CMD="docker"
            else
              DOCKER_CMD="sudo docker"
            fi

            # Step 1: Login Docker to ECR
            echo "Authenticating Docker with Amazon ECR..."
            echo "$ECR_TOKEN" | $DOCKER_CMD login --username AWS --password-stdin "$ECR_REGISTRY"

            # Step 2: Pull New Image
            echo "Pulling new image: $TARGET_IMAGE..."
            $DOCKER_CMD pull "$TARGET_IMAGE"

            # Step 3: Test New Version on temporary slot (Port 8081) BEFORE touching live port 80!
            CANDIDATE_CONTAINER="${CONTAINER_NAME}-candidate"
            $DOCKER_CMD rm -f "$CANDIDATE_CONTAINER" 2>/dev/null || true

            echo "Launching candidate container on port 8081 to verify health..."
            $DOCKER_CMD run -d --name "$CANDIDATE_CONTAINER" -p 8081:80 "$TARGET_IMAGE"

            # Step 4: Health Check on Candidate
            CANDIDATE_HEALTHY="false"
            for i in 1 2 3 4 5; do
              sleep 3
              if curl -s -f --connect-timeout 2 http://localhost:8081/ > /dev/null 2>&1 || curl -s -f --connect-timeout 2 http://localhost:8081/index.html > /dev/null 2>&1; then
                echo "Health check attempt $i: PASSED! Candidate is healthy."
                CANDIDATE_HEALTHY="true"
                break
              else
                echo "Health check attempt $i: Waiting for candidate container..."
              fi
            done

            # Step 5: Rollback Safeguard (If candidate fails, LIVE CONTAINER WAS NEVER TOUCHED!)
            if [ "$CANDIDATE_HEALTHY" != "true" ]; then
              echo "CRITICAL: Candidate failed health check! Aborting deployment."
              echo "SAFEGUARD ACTIVE: Your live production container was NEVER stopped."
              $DOCKER_CMD rm -f "$CANDIDATE_CONTAINER" 2>/dev/null || true
              exit 1
            fi

            # Step 6: Instant Zero-Downtime Promotion to Live Port 80
            echo "Candidate verified healthy. Promoting to live port 80..."
            $DOCKER_CMD rm -f "$CANDIDATE_CONTAINER" 2>/dev/null || true

            BACKUP_CONTAINER="${CONTAINER_NAME}-backup"
            $DOCKER_CMD rm -f "$BACKUP_CONTAINER" 2>/dev/null || true

            if [ "$($DOCKER_CMD ps -q -f name=^/${CONTAINER_NAME}$)" ]; then
              $DOCKER_CMD stop "$CONTAINER_NAME"
              $DOCKER_CMD rename "$CONTAINER_NAME" "$BACKUP_CONTAINER"
            fi

            sudo systemctl stop apache2 2>/dev/null || true
            sudo systemctl stop nginx 2>/dev/null || true

            $DOCKER_CMD run -d \
              --name "$CONTAINER_NAME" \
              -p 80:80 \
              --restart unless-stopped \
              "$TARGET_IMAGE"

            # Final check on port 80
            if ! curl -s -f --connect-timeout 3 http://localhost:80/ > /dev/null 2>&1; then
              echo "Port 80 check failed! Restoring backup container..."
              $DOCKER_CMD rm -f "$CONTAINER_NAME" 2>/dev/null || true
              $DOCKER_CMD rename "$BACKUP_CONTAINER" "$CONTAINER_NAME"
              $DOCKER_CMD start "$CONTAINER_NAME"
              echo "Rollback complete."
              exit 1
            fi

            $DOCKER_CMD rm -f "$BACKUP_CONTAINER" 2>/dev/null || true

            # Step 7: Auto-Cleanup: Keep only active container & last 4 Docker images
            echo "Cleaning up host Docker images (retaining last 4)..."
            $DOCKER_CMD container prune -f 2>/dev/null || true

            OLD_IMAGES=$($DOCKER_CMD images "$ECR_REGISTRY/$ECR_REPOSITORY" --format "{{.CreatedAt}}\t{{.ID}}" 2>/dev/null | sort -r | awk '{print $NF}' | awk '!seen[$0]++' | tail -n +5 || true)
            if [ -n "$OLD_IMAGES" ]; then
              echo "Deleting older Docker images beyond latest 4: $OLD_IMAGES"
              echo "$OLD_IMAGES" | xargs -r $DOCKER_CMD rmi -f 2>/dev/null || true
            fi
            $DOCKER_CMD image prune -f 2>/dev/null || true

            echo "=========================================================="
            echo "PRODUCTION DEPLOYMENT COMPLETED WITH ZERO DOWNTIME!"
            echo "=========================================================="

  # =========================================================================
  # STAGE 5: NOTIFICATION REPORT TO EMAIL VIA AWS SNS
  # =========================================================================
  notify:
    name: Operations Summary & SNS Email
    needs: [code-quality, security-audit, build-and-push, container-test, ecr-hygiene, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Operations Report to SNS Email
        env:
          QG_STATUS: ${{ needs.code-quality.result }}
          SEC_STATUS: ${{ needs.security-audit.result }}
          BUILD_STATUS: ${{ needs.build-and-push.result }}
          TEST_STATUS: ${{ needs.container-test.result }}
          PROD_STATUS: ${{ needs.deploy-production.result }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOPIC_ARN: ${{ env.SNS_TOPIC_ARN }}
        run: |
          if [ "$QG_STATUS" = "success" ] && [ "$SEC_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ] && [ "$TEST_STATUS" = "success" ] && [ "$PROD_STATUS" = "success" ]; then
            OVERALL_STATUS="SUCCESS"
            SUBJECT="[CI/CD SUCCESS] Zero-Downtime Production Deployment Succeeded - ${{ github.repository }}"
            SUMMARY="All stages passed successfully! The application was tested and promoted to production with zero downtime."
          else
            OVERALL_STATUS="FAILED"
            SUBJECT="[CI/CD ALERT] Production Deployment Failed - ${{ github.repository }}"
            SUMMARY="The deployment halted. If a failure occurred, the live version was protected and left untouched."
          fi

          MESSAGE=$(printf "==================================================\nAWS CI/CD PIPELINE OPERATIONS REPORT\n==================================================\nOverall Status: %s\nRepository:     %s\nBranch:         %s\nCommit SHA:     %s\nTriggered By:   %s\nWorkflow URL:   %s\n\nSTAGE BREAKDOWN:\n- 1A. Code Quality:      %s\n- 1B. Security Audit:    %s\n- 2.  Build & ECR Push:  %s\n- 3A. Runner Test ($0):  %s\n- 4.  Zero-Downtime EC2: %s\n\nDETAILS:\n%s\n==================================================" \
            "$OVERALL_STATUS" \
            "${{ github.repository }}" \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "${{ github.actor }}" \
            "$WORKFLOW_URL" \
            "$QG_STATUS" \
            "$SEC_STATUS" \
            "$BUILD_STATUS" \
            "$TEST_STATUS" \
            "$PROD_STATUS" \
            "$SUMMARY")

          echo "$MESSAGE"

          if [ -n "$TOPIC_ARN" ]; then
            echo "Publishing Operations Report to SNS: $TOPIC_ARN..."
            aws sns publish \
              --topic-arn "$TOPIC_ARN" \
              --subject "$SUBJECT" \
              --message "$MESSAGE" || echo "Warning: SNS publish failed."
          fi
